name: selfcheck
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - run: python tools/selfcheck.py
      - run: python tools/sync_workbench.py --check
      - run: python -B -m unittest discover -s tests -v
  evidence-map-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Verify synthetic evidence-map portability
        run: python -B -m unittest discover -s tests -p test_rare_disease_evidence_map.py -v
