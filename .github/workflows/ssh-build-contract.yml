name: SSH build contract

on:
  pull_request:
    paths:
      - '.github/workflows/*ssh-build*.yml'
      - 'tools/ssh_ci_*.py'
      - 'tests/test_ssh_ci_*.py'
      - 'docs/isolated-ssh-build.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/*ssh-build*.yml'
      - 'tools/ssh_ci_*.py'
      - 'tests/test_ssh_ci_*.py'
      - 'docs/isolated-ssh-build.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    # These tests never connect to the model host or receive its credentials.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Test admission, transport bounds, and receipt verification offline
        run: python -B -m unittest discover -s tests -p "test_ssh_ci_*.py" -v
      - name: Exercise root-owned claim storage on the disposable hosted Linux runner
        if: matrix.os == 'ubuntu-latest'
        # This is a temporary filesystem test, never a connection to the VM.
        run: sudo "$(command -v python)" -B -m unittest discover -s tests -p "test_ssh_ci_claims.py" -v
