# Standard (PEP 621) project metadata for szl-skills.
#
# The skills ship as per-skill ZIP archives (tools/package_science.py) and
# through .claude-plugin/marketplace.json, not as an importable package. The
# tools/ helpers are imported from a checkout as the namespace "tools", and
# each skill's kernel and scripts are loaded by file path. Installing the
# project therefore installs metadata only.
#
# The release version stays in .claude-plugin/marketplace.json. Version 0.0.0
# marks a distribution that is never published, and the
# "Private :: Do Not Upload" classifier makes PyPI refuse an upload.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-skills"
version = "0.0.0"
description = "SZL Holdings evidence, decision and reproducible-research skills, with their offline checks"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "SZL Holdings" }]
dependencies = []
classifiers = [
    "Private :: Do Not Upload",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
# The suites use only the standard library (python -B -m unittest discover -s tests),
# so the test extra is empty; it exists so `pip install -e .[test]` resolves cleanly.
test = []

[project.urls]
Homepage = "https://github.com/szl-holdings/szl-skills"
Source = "https://github.com/szl-holdings/szl-skills"
Issues = "https://github.com/szl-holdings/szl-skills/issues"
Changelog = "https://github.com/szl-holdings/szl-skills/blob/main/CHANGELOG.md"

[tool.setuptools]
# Explicitly empty: nothing is installed, and automatic package discovery
# stays off.
packages = []
py-modules = []
